<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">DecisionRAG: retrieval by decisions</title>
<desc id="desc">A simplified adaptation of Figure 2 in Retriever-Free Retrieval. The decision model retains two documents, expands their passages, and prunes an irrelevant document. Blue paths indicate retained candidates. The running example retrieves a passage about Leonard Shelby from Memento.</desc>
